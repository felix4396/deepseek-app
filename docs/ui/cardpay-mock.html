<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><style>body{margin:0;background:#f7f7f8;color:#202124;font:14px system-ui,sans-serif}.app{width:390px;min-height:844px;margin:auto;background:white;padding:20px;box-sizing:border-box}.title{font-size:22px;font-weight:700;margin:8px 0 4px}.sub{color:#73777f;line-height:1.5}.key,.notice,.balance,.status{padding:12px;border-radius:12px;margin:12px 0;background:#f2f3f5}.notice{background:#fff7e6;color:#8a5a00}.card{border:1px solid #e2e4e8;border-radius:14px;padding:14px;margin:10px 0}.price{font-size:19px;font-weight:700;margin-top:5px}.small{font-size:12px;color:#73777f;margin-top:6px}.input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d8dbe0;border-radius:10px;margin:8px 0;font-size:14px}.button{display:inline-block;padding:11px 16px;border-radius:10px;border:0;background:#111;color:#fff;margin-top:4px}.disabled{background:#d8dbe0;color:#888}.pending{background:#eef6ff;color:#195b9b}.error{background:#fff0f0;color:#b42318}.tabs{display:flex;gap:8px;margin:16px 0}.tab{padding:8px 12px;border-radius:9px;background:#eee}.active{background:#111;color:#fff}</style><div id=a></div><script>const base=`<div class=title>购买与兑换</div><div class=sub>付款将在系统浏览器中完成；当前仅展示接入状态。</div><div class=key>当前目标：abc••••9xyz</div>`;function render(kind){let x=base;if(kind==='entry')x+=`<div class=notice>支付网关尚未配置，购买暂未开放</div><div class=card><b>入门体验</b><div class=price>¥9.90 / 1M</div><div class=small>fixture 套餐 · 等待可信 pay_url</div></div><div class=card><b>长期使用</b><div class=price>¥39 / 5M</div><div class=small>fixture 套餐 · 等待可信 pay_url</div></div><button class="button disabled">购买暂未开放</button>`;if(kind==='redeem')x+=`<div class=title style="font-size:16px;margin-top:25px">兑换卡密</div><input class=input placeholder="输入卡密"><button class=button>确认兑换</button><div class=small>提交后将按 request_id 保持幂等重试</div>`;if(kind==='pending')x+=`<div class=title style="font-size:16px;margin-top:25px">兑换结果</div><div class="status pending"><b>额度已登记，正在同步</b><br><span class=small>实际可用额度以渠道为准</span></div><div class="status"><b>本站记账状态：pending</b><br><span class=small>不表示下游模型额度已经到账</span></div>`;if(kind==='error')x+=`<div class=title style="font-size:16px;margin-top:25px">余额</div><div class="status error">余额查询失败，请检查网络后重试</div><button class=button>手动刷新</button>`;a.innerHTML='<div class=app>'+x+'<div class=tabs>'+['entry','redeem','pending','error'].map(k=>`<span class="tab ${k===kind?'active':''}" onclick="render('${k}')">${k}</span>`).join('')+'</div></div>'}render(location.hash.slice(1)||'entry')</script>
